name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install default dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Matching regression evaluation
        run: python scripts/evaluate.py
      - name: Compile application sources
        run: python -m compileall -q app.py config.py src scripts

  container:
    name: Container build and health check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build default image
        run: docker build -t matchwise:ci .
      - name: Verify container becomes healthy
        shell: bash
        run: |
          docker run --detach --name matchwise-check matchwise:ci
          for attempt in {1..30}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' matchwise-check)
            if [ "$status" = "healthy" ]; then
              docker stop matchwise-check
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              break
            fi
            sleep 3
          done
          docker logs matchwise-check
          docker inspect matchwise-check
          exit 1
      - name: Clean up container
        if: always()
        run: docker rm --force matchwise-check || true
